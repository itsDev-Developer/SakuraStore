<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sakura Store</title>
<style>
:root{--bg:#fbf6ff;--s1:#fff;--s2:#f1e7fb;--ink:#241633;--mut:#7a6a8c;--line:#e8d9f5;--a:#ff4f9a;--b:#7c5cff;--glass:rgba(255,255,255,.78);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0818;--s1:#1a1030;--s2:#241744;--ink:#f7eeff;--mut:#a995c4;--line:#2e2050;--glass:rgba(20,12,36,.78);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e0818;--s1:#1a1030;--s2:#241744;--ink:#f7eeff;--mut:#a995c4;--line:#2e2050;--glass:rgba(20,12,36,.78);color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:480px;margin:0 auto;min-height:100vh;position:relative;overflow-x:hidden}
.glow{position:absolute;inset:0 0 auto 0;height:460px;background:radial-gradient(closest-side at 15% 10%,rgba(255,79,154,.30),transparent),radial-gradient(closest-side at 90% 25%,rgba(124,92,255,.30),transparent);pointer-events:none}
main{position:relative;padding-bottom:120px}
.top{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 4px}
.logo{font-weight:800;font-size:25px;letter-spacing:-.5px}
.logo span{background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--a),var(--b));display:grid;place-items:center;font-size:18px}
.search{margin:10px 18px;display:flex;gap:10px;align-items:center;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:12px 14px;color:var(--mut)}
.search input{flex:1;background:none;border:0;outline:0;color:var(--ink);font-size:15px;min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 18px 8px;scrollbar-width:none}
.chip{flex:none;padding:8px 16px;border-radius:99px;background:var(--s1);border:1px solid var(--line);color:var(--mut);font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:linear-gradient(90deg,var(--a),var(--b));color:#fff;border-color:transparent}
h3{font-size:17px;margin:20px 18px 12px}
.hero{position:relative;margin:8px 18px 0;height:236px;border-radius:26px;overflow:hidden;box-shadow:0 16px 36px -14px rgba(124,92,255,.6);cursor:pointer}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 25%,rgba(10,5,20,.9))}
.hero .tx{position:absolute;left:16px;right:16px;bottom:14px;z-index:1;color:#fff;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.hero h2{font-size:22px;line-height:1.15}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.22);backdrop-filter:blur(6px);color:#fff;margin-bottom:6px}
.btn{border:0;border-radius:99px;padding:11px 22px;font-weight:700;font-size:14px;color:#fff;background:linear-gradient(90deg,var(--a),var(--b));box-shadow:0 8px 20px -8px var(--a);cursor:pointer;flex:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 14px;padding:0 18px}
.card{cursor:pointer;min-width:0}
.cv{position:relative;aspect-ratio:4/5;border-radius:22px;overflow:hidden;background:var(--s2);box-shadow:0 10px 24px -14px rgba(60,20,120,.6)}
.cv img{width:100%;height:100%;object-fit:cover;display:block}
.vb{position:absolute;left:10px;top:10px;font-size:11px;font-weight:700;color:#fff;padding:3px 9px;border-radius:99px;background:rgba(20,10,40,.55);backdrop-filter:blur(6px)}
.card b{display:block;margin-top:8px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card small{color:var(--mut);font-size:12px}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:30px}
.dh{position:relative;height:290px;overflow:hidden}
.dh .bg{position:absolute;inset:-24px;width:calc(100% + 48px);height:calc(100% + 48px);object-fit:cover;opacity:.9}
.dh:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15),var(--bg) 96%)}
.back{position:absolute;left:16px;top:16px;z-index:3;width:40px;height:40px;border-radius:50%;border:0;background:var(--glass);backdrop-filter:blur(10px);color:var(--ink);font-size:26px;line-height:1;cursor:pointer}
.dt{position:absolute;left:18px;right:18px;bottom:4px;z-index:2;display:flex;gap:14px;align-items:flex-end}
.ic{width:108px;height:108px;border-radius:28px;overflow:hidden;border:2px solid rgba(255,255,255,.75);flex:none;box-shadow:0 12px 28px -10px rgba(0,0,0,.6)}
.ic img{width:100%;height:100%;object-fit:cover;display:block}
.dt h1{font-size:21px;line-height:1.15}
.sub{color:var(--mut);font-size:13px;margin-top:3px}
.tags{display:flex;gap:8px;flex-wrap:wrap;padding:12px 18px 0}
.tag{padding:6px 12px;border-radius:99px;font-size:12px;font-weight:700;background:var(--s1);border:1px solid var(--line)}
.tag.g{background:linear-gradient(90deg,var(--a),var(--b));color:#fff;border-color:transparent}
.gal{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 18px;padding:0 18px;scrollbar-width:none}
.gal img{flex:none;height:230px;width:auto;max-width:78vw;border-radius:20px;scroll-snap-align:start;display:block;background:var(--s2)}
.desc{margin:0 18px;color:var(--mut);line-height:1.6}
.desc.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.more{margin:6px 18px 0;background:none;border:0;color:var(--a);font-weight:700;font-size:14px;cursor:pointer}
.kv{margin:0 18px;background:var(--s1);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:14px}
.kv div:last-child{border:0}.kv span{color:var(--mut)}.kv b{text-align:right}
.file{display:flex;align-items:center;gap:12px;margin:0 18px 10px;padding:12px 14px;background:var(--s1);border:1px solid var(--line);border-radius:18px}
.file i{flex:none;width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--a),var(--b));display:grid;place-items:center;font-style:normal;font-size:20px}
.file div{flex:1;min-width:0}.file b{display:block;font-size:13px;overflow-wrap:anywhere}.file small{color:var(--mut);font-size:12px}
.file button{border:1px solid var(--line);background:var(--s2);color:var(--ink);border-radius:99px;padding:8px 14px;font-weight:700;cursor:pointer}
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;gap:14px;align-items:center;z-index:5}
.bar div{flex:1;min-width:0}.bar b{display:block}.bar small{display:block;color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .btn{padding:14px 30px;font-size:15px}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:13px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:9;max-width:90%;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
</style>
</head>

<div class="glow"></div>
<main id="app"></main>
<div id="toast"></div>

let demo=true,genre='All',q='';
const tg=window.Telegram&&window.Telegram.WebApp;if(tg){tg.ready();tg.expand();}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>n>=1073741824?(n/1073741824).toFixed(1)+' GB':(n/1048576).toFixed(1)+' MB';
const ago=d=>{const h=(Date.now()-new Date(d))/36e5;return h<24?'Today':h<48?'Yesterday':Math.floor(h/24)+' days ago';};
const hu=a=>`hue-rotate(${a.hue||0}deg)`;
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200);}
let BOT='';
async function get(fid){
 if(demo){toast('Demo mode: connect your server to download');return;}
 if(!tg||!tg.initData){toast('Open this store inside Telegram');return;}
 toast('Sending to your chat…');
 try{
  const r=await fetch('/api/download',{method:'POST',headers:{'Content-Type':'application/json','X-Init-Data':tg.initData},body:JSON.stringify({file_id:+fid})});
  if(r.ok){toast('Sent to your Telegram chat ✅');return;}
  if(r.status===409&&BOT){tg.openTelegramLink('https://t.me/'+BOT+'?start=get_'+fid);return;}
  toast('Download failed, try again');
 }catch(e){toast('Network error');}
}
const card=a=>`<div class="card" data-id="${a.id}"><div class="cv"><img src="${a.images[0]}" style="filter:${hu(a)}" alt=""><span class="vb">v${esc(a.version)}</span></div><b>${esc(a.title)}</b><small>${esc(a.genre)} · ${fmt(a.files[0].size)}</small></div>`;
function home(){
 const f=APPS[0],gs=['All',...new Set(APPS.map(a=>a.genre))];
 return `<div class="top"><div class="logo">🌸 <span>Sakura</span> Store</div><div class="av">✨</div></div>
 <div class="search">🔍<input id="s" placeholder="Search games and apps…" value="${esc(q)}"></div>
 <div class="chips" id="ch">${gs.map(g=>`<div class="chip ${g===genre?'on':''}" data-g="${esc(g)}">${esc(g)}</div>`).join('')}</div>
 <div class="hero" data-id="${f.id}"><img src="${f.images[0]}" style="filter:${hu(f)}" alt=""><div class="tx"><div><span class="pill">NEW · v${esc(f.version)}</span><h2>${esc(f.title)}</h2></div><button class="btn" data-dl="${f.files[0].id}">Get</button></div></div>
 <h3>Latest uploads</h3><div class="grid" id="grid"></div>`;
}
function paint(){
 const l=APPS.filter(a=>(genre==='All'||a.genre===genre)&&a.title.toLowerCase().includes(q.toLowerCase()));
 const g=document.getElementById('grid');g.innerHTML=l.length?l.map(card).join(''):'<div class="empty">Nothing found 😢</div>';
 g.querySelectorAll('[data-id]').forEach(x=>x.onclick=()=>{location.hash=x.dataset.id;});
}
function detail(a){
 const f=a.files[0];
 return `<div class="dh"><img class="bg" src="${a.images[0]}" style="filter:blur(22px) saturate(1.3) ${hu(a)}" alt=""><button class="back" id="bk">‹</button>
 <div class="dt"><div class="ic"><img src="${a.images[0]}" style="filter:${hu(a)}" alt=""></div><div><h1>${esc(a.title)}</h1><div class="sub">v${esc(a.version)} · ${ago(a.date)}</div></div></div></div>
 <div class="tags"><span class="tag g">${esc(a.genre)}</span><span class="tag">${esc(a.language)}</span><span class="tag">Censorship: ${esc(a.censorship)}</span></div>
 <h3>Preview</h3><div class="gal">${a.images.map(s=>`<img src="${s}" style="filter:${hu(a)}" alt="">`).join('')}</div>
 <h3>About</h3><div class="desc clamp" id="ds">${esc(a.description).replace(/\n/g,'<br>')}</div><button class="more" id="mr">Read more</button>
 <h3>Details</h3><div class="kv"><div><span>Version</span><b>${esc(a.version)}</b></div><div><span>Genre</span><b>${esc(a.genre)}</b></div><div><span>Language</span><b>${esc(a.language)}</b></div><div><span>Censorship</span><b>${esc(a.censorship)}</b></div><div><span>Updated</span><b>${ago(a.date)}</b></div></div>
 <h3>Files</h3>${a.files.map(x=>`<div class="file"><i>📦</i><div><b>${esc(x.name)}</b><small>${fmt(x.size)}</small></div><button data-dl="${x.id}">⬇</button></div>`).join('')}
 <div class="bar"><div><b>${fmt(f.size)}</b><small>${esc(f.name)}</small></div><button class="btn" data-dl="${f.id}">Download</button></div>`;
}
function render(){
 const a=APPS.find(x=>x.id==location.hash.slice(1)),el=document.getElementById('app');
 el.innerHTML=a?detail(a):home();
 if(a){
  document.getElementById('bk').onclick=()=>{location.hash='';};
  const m=document.getElementById('mr'),d=document.getElementById('ds');
  m.onclick=()=>{const c=d.classList.toggle('clamp');m.textContent=c?'Read more':'Show less';};
 }else{
  const s=document.getElementById('s');s.oninput=e=>{q=e.target.value;paint();};
  document.querySelectorAll('[data-g]').forEach(x=>x.onclick=()=>{genre=x.dataset.g;document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===x));paint();});
  document.querySelector('.hero').onclick=e=>{if(!e.target.closest('[data-dl]'))location.hash=APPS[0].id;};
  paint();
 }
 el.querySelectorAll('[data-dl]').forEach(x=>x.onclick=e=>{e.stopPropagation();get(x.dataset.dl);});
}
addEventListener('hashchange',()=>{render();scrollTo(0,0);});
(async()=>{try{const r=await fetch('/api/posts');if(r.ok){const j=await r.json();if(Array.isArray(j)&&j.length){APPS=j;demo=false;try{BOT=(await(await fetch('/api/config')).json()).bot||'';}catch(e){}}}}catch(e){}render();})();
</script>
